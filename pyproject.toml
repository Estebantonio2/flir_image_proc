[project]
name = "flir-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flirimageextractor>=1.5.9",
    "matplotlib>=3.10.0",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "torchaudio>=2.7.0",
    "optuna>=4.8.0",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", marker = "sys_platform != 'darwin'" }
]
torchvision = [
  { index = "pytorch-cuda", marker = "sys_platform != 'darwin'" }
]
torchaudio = [
  { index = "pytorch-cuda", marker = "sys_platform != 'darwin'" }
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]

